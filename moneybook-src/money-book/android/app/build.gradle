apply plugin: 'com.android.application'

apply from: '../variables.gradle'

// 从 gradle.properties 读取版本号,缺省时使用 1
def versionCodeProp = project.findProperty('versionCode') ?: '1'
def versionNameProp = project.findProperty('versionName') ?: '1.0.0'

android {
    namespace 'com.mavis.moneybook'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mavis.moneybook'
        minSdk 23
        targetSdk 34
        versionCode Integer.parseInt(versionCodeProp)
        versionName versionNameProp
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // v2.2.46: APK 输出文件名固定(不带版本号) — 用拼音避免 gradle 中文路径问题
    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def fixedName = "MoneyBook"
            if (variant.buildType.name == "release") {
                output.outputFileName = "${fixedName}.apk"
            } else {
                output.outputFileName = "${fixedName}-debug.apk"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        // v2.2.80: release 也用 debug 签名,保证与线上已安装版本(同 cert)一致,可覆盖安装
        release {
            signingConfig signingConfigs.debug
        }
    }
}

repositories {
    flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.work:work-runtime:2.9.0"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation project(':capacitor-community-sqlite')
    implementation project(':capacitor-preferences')
    implementation project(':capacitor-app')
    implementation project(':capacitor-haptics')
    implementation project(':capacitor-local-notifications')
}

apply from: 'capacitor.build.gradle'
